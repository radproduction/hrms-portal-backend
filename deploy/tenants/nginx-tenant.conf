# One organisation's HRMS portal on its own subdomain.
#
# Subdomains rather than path prefixes (nowhrms.com/skntheory) because each
# organisation then gets its own browser origin. The session cookie is named
# app_session_id at path "/" in every copy of this codebase, so on a shared
# origin the three portals would overwrite each other's sessions — signing in
# to one would sign you out of the others. Separate origins also mean an XSS
# in one organisation's portal cannot touch another's localStorage or call its
# API. None of that needs a single line of application code to change.
#
# Install (per tenant):
#   sudo cp nginx-tenant.conf /etc/nginx/sites-available/hrms-skntheory
#   sudo sed -i 's/__TENANT__/skntheory/g; s/__DOMAIN__/nowhrms.com/g; s/__PORT__/3001/g' \
#            /etc/nginx/sites-available/hrms-skntheory
#   sudo ln -sf /etc/nginx/sites-available/hrms-skntheory /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then the certificate, which rewrites the ssl_* lines below:
#   sudo certbot --nginx -d skntheory.nowhrms.com
#
# A per-subdomain certificate uses the HTTP-01 challenge and needs nothing from
# the DNS registrar. A wildcard would need DNS-01 and API access to the domain,
# which is more setup for no benefit at three tenants.

upstream hrms___TENANT__ {
    server 127.0.0.1:__PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __TENANT__.__DOMAIN__;

    # Certbot needs this to stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://__TENANT__.__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __TENANT__.__DOMAIN__;

    # certbot --nginx replaces these two lines.
    ssl_certificate     /etc/letsencrypt/live/__TENANT__.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__TENANT__.__DOMAIN__/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header Referrer-Policy         "same-origin"      always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Employee document uploads are capped at 8 MB in the app; leave headroom
    # for multipart overhead.
    client_max_body_size 12M;

    # Backend and frontend are separate repositories checked out side by side,
    # exactly like the original portal. vite writes the SPA here; esbuild
    # writes the server to ../backend/dist, which systemd runs.
    root  /srv/tenants/__TENANT__/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # tRPC and the REST upload endpoints.
    location /api/ {
        proxy_pass http://hrms___TENANT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # cookies.ts reads this to decide the Secure flag. Do not drop it.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    # Uploaded avatars and employee documents, served by the app so that
    # UPLOADS_DIR stays the single source of truth for where files live.
    location /uploads/ {
        proxy_pass http://hrms___TENANT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Documents are private; keep them out of shared caches.
        add_header Cache-Control "private, no-store" always;
    }

    # Socket.IO needs the upgrade headers and a long read timeout, otherwise
    # realtime notifications silently stop working.
    location /socket.io/ {
        proxy_pass http://hrms___TENANT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # Everything else is the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
