# Phase 1: plain HTTP on the droplet's IP, before a domain is pointed here.
#
# Same routing as nginx.conf but without TLS, so the app can be exercised end
# to end while DNS is still pending. Run deploy/enable-ssl.sh once the domain
# resolves; that swaps in nginx.conf and obtains the certificate.
#
# Session cookies work here because COOKIE_SAMESITE=lax does not require the
# Secure flag. Do not use SameSite=None over plain HTTP — browsers drop it.

upstream hrms_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 12M;

    root  /srv/hrms/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        add_header Cache-Control "private, no-store" always;
    }

    location /socket.io/ {
        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
