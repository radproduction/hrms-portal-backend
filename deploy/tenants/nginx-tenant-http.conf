# Phase 1: one organisation's portal on plain HTTP.
#
# This goes in first, before any certificate exists. The full HTTPS config
# names /etc/letsencrypt/live/<host>/fullchain.pem, and nginx refuses to load
# a config whose certificate file is missing — so enabling the HTTPS site
# first would break `nginx -t` for the whole server, blocking every reload and
# stopping nginx from starting at all after a reboot. That would take
# nowhrms.com down along with it.
#
# So: serve over HTTP, let certbot use this to answer the ACME challenge, and
# only then swap in nginx-tenant.conf. enable-ssl-tenant.sh does that swap.
#
# Rendered by setup-tenant.sh; you should not need to install it by hand.

upstream hrms___TENANT___http {
    server 127.0.0.1:__PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __TENANT__.__DOMAIN__;

    # Certbot writes its challenge file here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 12M;

    root  /srv/tenants/__TENANT__/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://hrms___TENANT___http;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://hrms___TENANT___http;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        add_header Cache-Control "private, no-store" always;
    }

    location /socket.io/ {
        proxy_pass http://hrms___TENANT___http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
