# Rad HRMS — single-domain nginx site.
#
# Frontend and API share one origin, which is what lets the session cookie be
# SameSite=Lax and removes CORS from the picture entirely.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/hrms
#   sudo sed -i 's/__DOMAIN__/nowhrms.com/g' /etc/nginx/sites-available/hrms
#   sudo ln -sf /etc/nginx/sites-available/hrms /etc/nginx/sites-enabled/hrms
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain the certificate, which rewrites the ssl_* lines below:
#   sudo certbot --nginx -d nowhrms.com

upstream hrms_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Certbot needs this to stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # certbot --nginx replaces these two lines.
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header Referrer-Policy         "same-origin"      always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Employee document uploads are capped at 8 MB in the app; leave headroom
    # for multipart overhead.
    client_max_body_size 12M;

    root  /srv/hrms/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # tRPC and the REST upload endpoints.
    location /api/ {
        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # cookies.ts reads this to decide the Secure flag. Do not drop it.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    # Uploaded avatars and employee documents, served by the app so that
    # UPLOADS_DIR stays the single source of truth for where files live.
    location /uploads/ {
        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Documents are private; keep them out of shared caches.
        add_header Cache-Control "private, no-store" always;
    }

    # Socket.IO needs the upgrade headers and a long read timeout, otherwise
    # realtime notifications silently stop working.
    location /socket.io/ {
        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # Everything else is the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
