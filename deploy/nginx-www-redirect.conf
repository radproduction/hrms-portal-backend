# Sends www.<domain> to the bare domain so there is exactly one canonical
# origin. Without this a user who lands on www gets a session cookie scoped to
# www and appears logged out on the bare domain, because cookies are per-host.
#
# Installed by enable-ssl.sh only when www is included in the certificate.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __WWW__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    return 301 https://__DOMAIN__$request_uri;
}
